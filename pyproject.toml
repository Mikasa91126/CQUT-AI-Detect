[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidetect"
version = "1.0.0"
description = "离线中文 AI 生成率检测：判别器 + 困惑度 + 文体统计三引擎融合，输出段落级证据与单文件 HTML 报告"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ai-detect" }]
keywords = ["ai-detection", "chinese", "aigc", "offline", "nlp"]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "transformers>=4.30",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
docx = ["python-docx>=1.0"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7.4"]

[project.scripts]
aidetect = "aidetect.cli:main"

[tool.setuptools.packages.find]
include = ["aidetect*"]

[tool.setuptools.package-data]
aidetect = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
